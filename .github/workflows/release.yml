name: Release Multi-Plataforma

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# Instalador oficial do Visual C++ Redistributable (x64) na versão e no hash fixos:
# o build do Windows o instala e a release o publica para quem joga
env:
  VC_REDIST_URL: https://download.visualstudio.microsoft.com/download/pr/990c720a-46ce-4dc7-87b9-c2eb615d34b9/CC0FF0EB1DC3F5188AE6300FAEF32BF5BEEBA4BDD6E8E445A9184072096B713B/VC_redist.x64.exe
  VC_REDIST_SHA256: cc0ff0eb1dc3f5188ae6300faef32bf5beeba4bdd6e8e445a9184072096b713b

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Instalar dependências do Python
        run: uv sync

      # A versão da release é a do pyproject.toml, preparada por `pnpm release`
      - name: Ler a versão do pyproject.toml
        id: version
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Versão inválida no pyproject.toml: '$VERSION'. Use SemVer (ex: 1.2.3)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Falhar se tag já existir
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::A tag '$TAG' já existe. Rode 'pnpm release' para preparar a próxima versão."
            exit 1
          fi

      # O número que os commits desde a última tag pedem; o pyproject.toml não pode ficar abaixo
      - name: Conferir a versão com os commits
        shell: bash
        run: |
          uv run python -m scripts.release --check | tee -a "$GITHUB_STEP_SUMMARY"

  # Check vermelho: nenhum executável é montado nem publicado
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  build:
    needs: [validate, check]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist_binary: SimuladorFinanceiro
            release_binary: SimuladorFinanceiro-linux
          - os: windows-latest
            dist_binary: SimuladorFinanceiro.exe
            release_binary: SimuladorFinanceiro-windows.exe
          - os: macos-latest
            dist_binary: SimuladorFinanceiro
            release_binary: SimuladorFinanceiro-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Compilar frontend
        working-directory: frontend
        run: pnpm run build

      - name: Instalar dependências do Python
        run: uv sync --group build

      - name: Cache do zip oficial do Postgres
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: .cache/postgres
          key: postgres-${{ hashFiles('scripts/build_postgres.py') }}

      # O initdb do build e o servidor do jogador importam o runtime do Visual C++
      - name: Instalar o Visual C++ Redistributable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest $env:VC_REDIST_URL -OutFile vc_redist.x64.exe
          $hash = (Get-FileHash vc_redist.x64.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:VC_REDIST_SHA256) { throw "Hash do vc_redist diferente do fixado: $hash" }
          # 0 instalou, 1638 já há versão igual ou mais nova, 3010 pede reinício
          $process = Start-Process ./vc_redist.x64.exe -ArgumentList '/install','/quiet','/norestart' -Wait -PassThru
          if ($process.ExitCode -notin 0, 1638, 3010) { throw "vc_redist falhou: $($process.ExitCode)" }

      - name: Preparar o Postgres embarcado
        if: runner.os == 'Windows'
        run: uv run python -m scripts.build_postgres

      - name: Gerar executável com PyInstaller
        run: uv run pyinstaller SimuladorFinanceiro.spec --clean --noconfirm

      - name: Preparar artefato de release
        shell: bash
        run: |
          mkdir -p release-assets
          cp "dist/${{ matrix.dist_binary }}" "release-assets/${{ matrix.release_binary }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_binary }}
          path: release-assets/${{ matrix.release_binary }}

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Falhar se tag já existir
        env:
          TAG: v${{ needs.validate.outputs.version }}
        run: |
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::A tag '$TAG' já existe. Rode 'pnpm release' para preparar a próxima versão."
            exit 1
          fi

      # A descrição da release é a seção da versão no CHANGELOG.md
      - name: Extrair as notas da versão
        run: python3 scripts/release.py --notes > release-notes.md

      - name: Download dos artefatos
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: SimuladorFinanceiro-*
          merge-multiple: true

      # O Postgres embarcado no Windows precisa dele; a release o leva para quem não o tem
      - name: Baixar o Visual C++ Redistributable oficial
        run: |
          curl -fsSL "$VC_REDIST_URL" -o release-assets/vc_redist.x64.exe
          echo "$VC_REDIST_SHA256  release-assets/vc_redist.x64.exe" | sha256sum -c -

      - name: Criar release e anexar executáveis
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }} (Acesso antecipado)
          body_path: release-notes.md
          files: |
            release-assets/SimuladorFinanceiro-windows.exe
            release-assets/SimuladorFinanceiro-linux
            release-assets/SimuladorFinanceiro-macos
            release-assets/vc_redist.x64.exe
