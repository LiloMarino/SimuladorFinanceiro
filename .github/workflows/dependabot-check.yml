name: Checagem das PRs do Dependabot

# Roda só quando o Dependabot abre ou atualiza uma PR: push na main e PR de
# outra origem não disparam este workflow
on:
  pull_request:
    branches:
      - main

# Uma checagem por PR; um rebase do Dependabot cancela a anterior
concurrency:
  group: dependabot-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependências do Python
        run: uv sync --dev

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # lint, typecheck, pytest e eslint + tsc do frontend
      - name: Rodar a checagem do projeto
        run: pnpm run check
