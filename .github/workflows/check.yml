name: Checagem do projeto

# A checagem completa roda antes de cada release e nas PRs do Dependabot que mexem
# no Python, na raiz ou nas Actions: lint, typecheck, pytest, deptry e oxlint, oxfmt,
# tsc, knip e vitest do frontend, com PostgreSQL para os testes de banco. As PRs que
# só mexem no frontend ou na docs pedem a área delas e rodam só o que ela usa.
on:
  workflow_call:
    inputs:
      area:
        description: "all, frontend ou docs"
        type: string
        default: all

jobs:
  check:
    if: inputs.area == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # A imagem oficial sobe em UTF-8; o job só começa com o banco aceitando conexão
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Os testes criam e apagam bancos `simfin_test_*` neste servidor
    env:
      POSTGRES_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Instalar dependências do Python
        run: uv sync --dev

      # O `pnpm run check` da raiz divide as trilhas com o concurrently da raiz
      - name: Instalar dependências da raiz
        run: pnpm install --frozen-lockfile

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Rodar a checagem do projeto
        run: pnpm run check

  frontend:
    if: inputs.area == 'frontend'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # oxlint, oxfmt, tsc, knip e vitest
      - name: Rodar a checagem do frontend
        run: pnpm run check:front

  docs:
    if: inputs.area == 'docs'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: docs/pnpm-lock.yaml

      # O diagrama do banco e a página de novidades saem de scripts Python
      - name: Instalar dependências do Python
        run: uv sync

      - name: Instalar dependências da docs
        working-directory: docs
        run: pnpm install --frozen-lockfile

      # O build gera o diagrama, as novidades e a API antes de montar o site
      - name: Montar o site
        working-directory: docs
        run: pnpm run build

      # O tsc lê o que o build acabou de gerar
      - name: Checar os tipos da docs
        working-directory: docs
        run: pnpm exec tsc
