name: Deploy Docs (gh-pages)

on:
  # Permite executar manualmente via botão no Actions
  workflow_dispatch:

  # Executa automaticamente quando há mudanças na pasta docs/, nos models
  # (o diagrama do banco) ou no CHANGELOG.md (a página de novidades)
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "backend/core/models/**"
      - "scripts/erd.py"
      - "CHANGELOG.md"
      - "scripts/changelog_page.py"

# Garante que apenas um deploy rode por vez
concurrency:
  group: "docs-gh-pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # As imagens da demonstração moram no branch `demo` (`pnpm demo publish`)
      - name: Fetch demo images
        run: |
          mkdir -p docs/static/demo
          if git fetch --depth=1 origin demo; then
            git archive FETCH_HEAD | tar -x -C docs/static/demo
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python dependencies
        run: uv sync

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: docs
        run: pnpm build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build
          publish_branch: gh-pages
          # Só o site da última publicação: as imagens antigas não se acumulam
          force_orphan: true
