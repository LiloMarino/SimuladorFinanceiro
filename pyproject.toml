[project]
name = "simulador-financeiro"
version = "3.2.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.136.3",
    "numpy>=2",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.32",
    "python-socketio>=5.16.2",
    "sqlalchemy>=2.0.50",
    "starlette>=0.40",
    "toml>=0.10.2",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=1.4.1",
]

[tool.deptry]
known_first_party = ["backend"]
# Os exemplos da documentação rodam na máquina de quem baixa, com as dependências deles
extend_exclude = ["docs/static/exemplos"]

[tool.deptry.per_rule_ignores]
# python-multipart é carregado pelo FastAPI sozinho ao receber formulário e arquivo
DEP002 = ["python-multipart"]
# pydantic_core acompanha a versão do pydantic, que já está declarado
DEP003 = ["pydantic_core"]
# Os scripts de desenvolvimento usam as ferramentas do grupo dev
DEP004 = ["playwright", "matplotlib", "yaml", "PIL"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.alembic]
script_location = "%(here)s/backend/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "B",
    "UP",
    "SIM",
    "PERF",
    "RUF",
    "TRY",
    "PTH",
    "PLC0415",
    "ERA",
    "DTZ",
    "PLE",
    "PLW",
    "S",
    "LOG",
    "PGH",
    "FAST",
    "BLE",
    "PT011",
]
ignore = [
    "E501",    # line too long
    "UP047",   # pyupgrade
    "TRY003",  # raise-vanilla-args
    "PLW0603", # global-statement: os globais são caches de módulo
    "PLW0108", # unnecessary-lambda: o lambda adia a busca do nome no monkeypatch
    "S311",    # random do simulador, que não é criptografia
    "S603",    # subprocess com lista de argumentos, sem shell
    "S607",    # executável pelo PATH (git, pnpm) nos scripts
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S101"]
"backend/migrations/**" = ["S608"] # SQL montado com as constantes da própria migration

[tool.ruff.format]
# Os trechos de código do guia são recortes, com a indentação da classe de onde saíram
exclude = ["*.md"]
quote-style = "double"
indent-style = "space"

[dependency-groups]
build = [
    "pyinstaller>=6.20.0",
]
dev = [
    "actionlint-py>=1.7.12.25",
    "deptry>=0.25.1",
    "git-cliff>=2.14.2",
    "httpx2>=2.13.1",
    "line-profiler>=5.0.2",
    "matplotlib>=3.10.9",
    "pillow>=13.0.0",
    "playwright>=1.64.0",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "radon>=6.0.1",
    "ruff>=0.15.16",
    "snakeviz>=2.2.2",
]
